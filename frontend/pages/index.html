<!doctype html>
<html>
<head>
  <title>Lead Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-50">
  <h1 class="text-2xl font-bold mb-4">Lead Service Dashboard</h1>
  <div class="grid grid-cols-2 gap-4">
    <div class="bg-white p-4 rounded shadow">
      <h2 class="font-bold mb-2">Clients</h2>
      <div id="clients"></div>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h2 class="font-bold mb-2">Drafts</h2>
      <div id="drafts"></div>
    </div>
  </div>
  <script>
    async function loadClients() {
      const r = await fetch('/clients');
      const clients = await r.json();
      document.getElementById('clients').innerHTML = clients.map(c => `<div>${c.name} - ${c.website}</div>`).join('');
    }
    async function loadDrafts() {
      const r = await fetch('/drafts');
      const drafts = await r.json();
      document.getElementById('drafts').innerHTML = drafts.map(d => `<div><b>${d.subject}</b> [${d.status}]</div>`).join('');
    }
    loadClients();
    loadDrafts();
  </script>
</body>
</html>
